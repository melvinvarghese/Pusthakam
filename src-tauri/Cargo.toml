[package]
name = "pusthakam"
version = "0.1.0"
description = "Pusthakam - offline library management system"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "pusthakam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
# Opens approved links in the system browser. Scoped in capabilities/default.json; never used for app data.
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite (includes FTS5) so every OS ships the same engine; "backup" = SQLite online backup API.
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
thiserror = "2"
sha2 = "0.11"
# Import: CSV files and base64 transport of file bytes from the UI.
csv = "1"
quick-xml = "0.42"
base64 = "0.22"
png = "0.18"
# Password hashing (RustCrypto argon2id). Pinned to 0.5: the 0.6 line changes the API (DECISIONS D-014).
argon2 = "0.5"
# Operating-system random numbers for password salts (same rand_core line argon2 0.5 uses).
rand_core = { version = "0.6", features = ["getrandom"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"
tempfile = "3"
calamine = "0.30.1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
base64 = "0.22"
# Lets tests call the real commands through Tauri's IPC layer with a mock runtime (no window needed).
tauri = { version = "2", features = ["test"] }

# Argon2 is deliberately slow; optimise it even in debug builds so tests and `tauri dev` stay responsive.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_Controls_Dialogs"] }
