[package]
name = "pusthakam"
version = "0.1.0"
description = "Pusthakam - offline library management system"
edition = "2021"
rust-version = "1.80"
publish = false

[lib]
name = "pusthakam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Bundled SQLite (includes FTS5) so every OS ships the same engine; "backup" = SQLite online backup API.
rusqlite = { version = "0.42", features = ["bundled", "backup"] }
thiserror = "2"
sha2 = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
tracing-appender = "0.2"

[dev-dependencies]
tempfile = "3"
