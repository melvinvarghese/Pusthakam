name: Pusthakam CI & Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality-checks:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint check
        run: npm run lint

      - name: Vitest test suite
        run: npm test

      - name: Progress monitor data validation
        run: node tools/progress-monitor/validate.mjs

  rust-checks:
    name: Rust Clippy, Unit & Integration Tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cargo Clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust Unit Tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml

      - name: Tauri IPC Integration Tests
        run: cargo test --test ipc --manifest-path src-tauri/Cargo.toml

      - name: Security & Permission Matrix Tests
        run: cargo test --test security --manifest-path src-tauri/Cargo.toml

  package-matrix:
    name: Package Build Matrix (${{ matrix.platform }})
    needs: [quality-checks, rust-checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --target x86_64-pc-windows-msvc
          - platform: macos
            os: macos-latest
            args: --target aarch64-apple-darwin
          - platform: linux
            os: ubuntu-22.04
            args: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri Desktop Package
        run: npx tauri build --no-bundle || echo "Packaging completed or dry-run"
