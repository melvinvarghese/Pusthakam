name: Pusthakam CI & Quality Checks

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  quality-checks:
    name: Frontend Lint, Types & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: ESLint check
        run: npm run lint
      - name: Vitest test suite
        run: npm test
      - name: Progress monitor data validation
        run: node tools/progress-monitor/validate.mjs
      - name: Production bundle build
        run: npm run build

  rust-checks:
    name: Rust Clippy, Unit & Integration Tests
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Rust Formatting (cargo fmt --check)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Cargo Clippy (-D warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - name: Rust Unit Tests
        run: cargo test --lib --manifest-path src-tauri/Cargo.toml
      - name: Tauri IPC Integration Tests
        run: cargo test --test ipc --manifest-path src-tauri/Cargo.toml
      - name: Security & Permission Matrix Tests
        run: cargo test --test security --manifest-path src-tauri/Cargo.toml

  package-matrix:
    name: Package Build Matrix (${{ matrix.platform }})
    needs: [quality-checks, rust-checks]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: ""
          - platform: macos
            os: macos-latest
            args: ""
          - platform: linux
            os: ubuntu-22.04
            args: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: 'npm'
      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install npm dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Build Tauri Desktop Package
        run: npx tauri build ${{ matrix.args }}
      - name: Linux Package Installation & Smoke Test
        if: matrix.platform == 'linux'
        run: |
          DEB_FILE=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -n 1)
          if [ -f "$DEB_FILE" ]; then
            echo "Installing $DEB_FILE..."
            sudo dpkg -i "$DEB_FILE"
            echo "Verifying installed desktop assets..."
            DESKTOP_FILE=$(dpkg -L pusthakam | grep -E '^/usr/share/applications/[^/]+\.desktop
            test -f /usr/share/icons/hicolor/128x128/apps/pusthakam.png || true
            echo "Testing package uninstallation..."
            sudo dpkg -r pusthakam
            test ! -f /usr/bin/pusthakam
            echo "Linux Debian package verified successfully."
          fi
      - name: macOS Package & Bundle Integrity Smoke Test
        if: matrix.platform == 'macos'
        run: |
          DMG_FILE=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -n 1)
          if [ -f "$DMG_FILE" ]; then
            echo "Mounting $DMG_FILE..."
            hdiutil attach "$DMG_FILE" -mountpoint /Volumes/PusthakamSmoke
            test -d /Volumes/PusthakamSmoke/Pusthakam.app
            test -f /Volumes/PusthakamSmoke/Pusthakam.app/Contents/MacOS/pusthakam
            test -f /Volumes/PusthakamSmoke/Pusthakam.app/Contents/Info.plist
            otool -L /Volumes/PusthakamSmoke/Pusthakam.app/Contents/MacOS/pusthakam
            hdiutil detach /Volumes/PusthakamSmoke
            echo "macOS DMG mount, App structure and binary integrity verified successfully."
          fi
      - name: Windows Package Installation & Smoke Test
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($installer) {
            Write-Host "Running silent install test for $($installer.FullName)..."
            $testDir = "D:\ci_smoke_nsis"
            if (Test-Path $testDir) { Remove-Item -Recurse -Force $testDir }
            Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$testDir" -Wait
            if (-not (Test-Path "$testDir\pusthakam.exe")) { throw "pusthakam.exe not installed" }
            if (-not (Test-Path "$testDir\uninstall.exe")) { throw "uninstall.exe not installed" }
            Write-Host "Verifying silent uninstall..."
            Start-Process -FilePath "$testDir\uninstall.exe" -ArgumentList "/S", "_?=$testDir" -Wait
            Start-Sleep -Seconds 2
            Write-Host "Windows NSIS package verified successfully."
          }
      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pusthakam-${{ matrix.platform }}-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
 | head -n 1)
            test -n "$DESKTOP_FILE"
            test -f "$DESKTOP_FILE"
            test -f /usr/share/icons/hicolor/128x128/apps/pusthakam.png || true
            echo "Testing package uninstallation..."
            sudo dpkg -r pusthakam
            test ! -f /usr/bin/pusthakam
            echo "Linux Debian package verified successfully."
          fi
      - name: macOS Package & Bundle Integrity Smoke Test
        if: matrix.platform == 'macos'
        run: |
          DMG_FILE=$(ls src-tauri/target/release/bundle/dmg/*.dmg 2>/dev/null | head -n 1)
          if [ -f "$DMG_FILE" ]; then
            echo "Mounting $DMG_FILE..."
            hdiutil attach "$DMG_FILE" -mountpoint /Volumes/PusthakamSmoke
            test -d /Volumes/PusthakamSmoke/Pusthakam.app
            test -f /Volumes/PusthakamSmoke/Pusthakam.app/Contents/MacOS/pusthakam
            test -f /Volumes/PusthakamSmoke/Pusthakam.app/Contents/Info.plist
            otool -L /Volumes/PusthakamSmoke/Pusthakam.app/Contents/MacOS/pusthakam
            hdiutil detach /Volumes/PusthakamSmoke
            echo "macOS DMG mount, App structure and binary integrity verified successfully."
          fi
      - name: Windows Package Installation & Smoke Test
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          if ($installer) {
            Write-Host "Running silent install test for $($installer.FullName)..."
            $testDir = "D:\ci_smoke_nsis"
            if (Test-Path $testDir) { Remove-Item -Recurse -Force $testDir }
            Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$testDir" -Wait
            if (-not (Test-Path "$testDir\pusthakam.exe")) { throw "pusthakam.exe not installed" }
            if (-not (Test-Path "$testDir\uninstall.exe")) { throw "uninstall.exe not installed" }
            Write-Host "Verifying silent uninstall..."
            Start-Process -FilePath "$testDir\uninstall.exe" -ArgumentList "/S", "_?=$testDir" -Wait
            Start-Sleep -Seconds 2
            Write-Host "Windows NSIS package verified successfully."
          }
      - name: Upload Package Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pusthakam-${{ matrix.platform }}-bundle
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: warn
